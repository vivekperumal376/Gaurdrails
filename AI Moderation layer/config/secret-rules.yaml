rules:
  - id: SECRET-APIKEY-001
    category: API_KEY
    pattern: >-
      \b(?:api[_ -]?key|access[_ -]?token|secret[_ -]?key)\s*[:=]\s*["']?([A-Za-z0-9_./+=-]{8,})
    flags: "i"
  - id: SECRET-PRIVATEKEY-001
    category: PRIVATE_KEY
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
    flags: "i"
  - id: SECRET-TOKEN-001
    category: API_KEY
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,})\b'
    flags: ""